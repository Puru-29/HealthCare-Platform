name: healthcare-platform

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy database/.env.example to database/.env and set local values}
      POSTGRES_USER: ${POSTGRES_USER:?Copy database/.env.example to database/.env and set local values}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy database/.env.example to database/.env and set local values}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - healthcare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  healthcare_postgres_data:
